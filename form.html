<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <meta name="description" content="Book of Mormon Application WDD 131 | BYU-I">
    <meta name="author" content="Ramiro Tapia">
    <link rel="stylesheet" href="styles/form.css">
    <script defer src="scripts/products.js"></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name <span class="required">*</span></label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="star-rating">
                    <label> ☆
                        <input type="radio" name="rating" value="1" required>
                    </label>
                    <label> ☆☆
                        <input type="radio" name="rating" value="2">
                    </label>
                    <label> ☆☆☆
                        <input type="radio" name="rating" value="3">
                    </label>
                    <label> ☆☆☆☆
                        <input type="radio" name="rating" value="4">
                    </label>
                    <label> ☆☆☆☆☆
                        <input type="radio" name="rating" value="5">
                    </label>
                </div>
            </fieldset>
            <label for="install-date">Date of Installation <span class="required">*</span></label>
            <input type="date" id="install-date" name="install-date" required>
            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <legend class="italic">(Check all that apply)</legend>
                <div class="features">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </div>
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review"></textarea>
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username">
                <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>
            &copy;<span id="currentyear"></span> | Ramiro Tapia | Bolivia
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Bolivia Travel Explorer.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bolivia Travel Explorer</title>
    <link rel="stylesheet" href="styles/destinations.css">
    <link rel="stylesheet" href="styles/destinations-larger.css">
    <script src="scripts/main.js" defer></script>
    <script src="scripts/contact.js" defer></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <span class="site-title">Bolivia Travel Explorer</span>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>

        <form id="contact-form">

            <label>
                Full Name *
                <input type="text" name="fullname" required>
            </label>
            <label>
                Email *
                <input type="email" name="email" required>
            </label>
            <!-- Radio Buttons -->
            <fieldset>
                <legend>Type of Traveler *</legend>
                <label>
                    <input type="radio" name="travelerType" value="Solo" required>
                    Solo
                </label>
                <label>
                    <input type="radio" name="travelerType" value="Couple">
                    Couple
                </label>
                <label>
                    <input type="radio" name="travelerType" value="Family">
                    Family
                </label>
            </fieldset>

            <!-- Checkboxes -->
            <fieldset>
                <legend>Destinations of Interest</legend>

                <label>
                    <input type="checkbox" name="destinations" value="Uyuni">
                    Salar de Uyuni
                </label>
                <label>
                    <input type="checkbox" name="destinations" value="Titicaca">
                    Lake Titicaca
                </label>
                <label>
                    <input type="checkbox" name="destinations" value="Sucre">
                    Sucre
                </label>
                <label>
                    <input type="checkbox" name="destinations" value="Madidi">
                    Madidi National Park
                </label>
                <label>
                    <input type="checkbox" name="destinations" value="Oruro">
                    Carnival of Oruro
                </label>
                <label>
                    <input type="checkbox" name="destinations" value="Scz">
                    Santa Cruz de la Sierra
                </label>
                <!-- add -->
            </fieldset>

            <!-- Date -->
            <label>
                Approximate Travel Date
                <input type="date" name="travelDate">
            </label>
            <label>
                Message (optional)
                <textarea name="message" rows="5"></textarea>
            </label>
            <button type="submit">Send Message</button>
        </form>

        <p id="confirmation"></p>
    </main>

    <footer>
        <p>&copy;<span id="year"></span> Bolivia Travel Explorer</p>
        <p id="lastModified"></p>
    </footer>

</body>

</html>

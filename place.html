<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolivia Page</title>
    <meta name="description" content="Country Page for WDD 131 Dynamic Web Fundamentals with Brother Blazzard | BYU-I">
    <meta name="author" content="Ramiro Tapia">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">
    <script defer src="scripts/getdates.js"></script>
</head>

<body>
    <header>
        <h1>Bolivia</h1>
    </header>
    <main>
        <section class="hero">
            <picture>
                <source srcset="images/bolivia-large.webp" media="(min-width: 480px)">
                <img src="images/bolivia-small.webp" alt="Picture of Bolivia" width="480" height="720">
            </picture>
            <section class="data">
                <h2>Data</h2>
                <p><strong>Area:</strong> 1,098,581 km²</p>
                <p><strong>Population:</strong> 12,186,079</p>
                <p><strong>Capital:</strong> Sucre</p>
                <p><strong>Languages:</strong> Spanish</p>
                <p><strong>Currency:</strong> Boliviano</p>
                <p><strong>Time Zone:</strong> UTC-4</p>
                <p><strong>Calling Code:</strong> +591</p>
                <p><strong>Internet TLD:</strong> .bo</p>
            </section>
            <section class="weather">
                <h2>Weather</h2>
                <img src="images/weather-icon.svg" alt="Weather Icon for wider view">
                <p><strong>Temperature:</strong> <span id="temp">10</span> °C</p>
                <p><strong>Conditions:</strong> Partly Cloudy</p>
                <p><strong>Wind:</strong> <span id="wind">5</span> km/h</p>
                <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
            </section>
        </section>
    </main>
    <footer>
        <p>
            &copy;<span id="currentyear"></span> | Ramiro Tapia | Bolivia
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
